<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKBK Avatar Studio | Reception</title><style>
*{box-sizing:border-box}body{margin:0;background:#191917;color:#f7efe5;font:15px system-ui,-apple-system,sans-serif}header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#211f1c}header a{color:inherit;text-decoration:none}header strong{letter-spacing:.15em}main{max-width:1050px;margin:auto;padding:24px 16px 48px;text-align:center}h1{font:clamp(26px,5vw,44px) Georgia,serif;margin:12px auto}p{color:#d8cabc}.stage{position:relative;margin:24px auto;width:min(100%,540px);aspect-ratio:9/16;max-height:75svh;overflow:hidden;background:#443e34;border:1px solid #777063;border-radius:12px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}.stage .night{opacity:0}body.night .stage .night{opacity:1}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin:18px auto}button,.back{border:1px solid #b9a892;color:inherit;background:#393630;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}button[disabled]{opacity:.6;cursor:not-allowed}.hint{font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #e4c597;outline-offset:3px}@media(max-width:600px){.stage{max-height:68svh}}
</style></head><body><header><strong>BKBK AVATAR STUDIO</strong><a href="index.html#portfolio">← Back to studio</a></header><main><h1>Welcome to the Avatar Studio</h1><p>Reception · Choose your space</p><div class="stage" role="img" aria-label="Avatar Studio reception interior"><img class="day" src="assets/8C7D4EBF-6DA0-406C-A52F-5EC39F4D7210.png" alt="Reception by day"><img class="night" src="assets/267DEB92-3376-4DF8-BDE2-36D5142D3493.png" alt=""></div><div class="controls"><button id="time" type="button" aria-pressed="false">☾ Night view</button></div><div class="controls"><button type="button" disabled title="The female room is being prepared">Female dressing room · Coming soon</button><button type="button" disabled title="The male room is being prepared">Male dressing room · Coming soon</button></div><p class="hint">Room doors will become available once their approved images are added.</p></main><script>const time=document.getElementById('time');let night=false;try{night=localStorage.getItem('bkbk-mode')==='night'}catch{}function render(){document.body.classList.toggle('night',night);time.textContent=night?'☀ Day view':'☾ Night view';time.setAttribute('aria-pressed',String(night))}time.addEventListener('click',()=>{night=!night;render()});render();</script></body></html>
