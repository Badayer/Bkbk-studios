<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKBK Avatar Studio | Reception</title><style>
*{box-sizing:border-box}body{margin:0;background:#191917;color:#f7efe5;font:15px system-ui,-apple-system,sans-serif}header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#211f1c}header a{color:inherit;text-decoration:none}header strong{letter-spacing:.15em}main{max-width:1050px;margin:auto;padding:24px 16px 48px;text-align:center}h1{font:clamp(26px,5vw,44px) Georgia,serif;margin:12px auto}p{color:#d8cabc}.stage{position:relative;margin:24px auto;width:min(96vw,calc(87dvh * 9 / 16),715px);aspect-ratio:9/16;max-height:87dvh;overflow:hidden;background:#443e34;border:1px solid #777063;border-radius:12px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .45s}.stage .night{opacity:0}body.night .stage .night{opacity:1}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin:18px auto}button,.back{border:1px solid #b9a892;color:inherit;background:#393630;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}button[disabled]{opacity:.6;cursor:not-allowed}.room-navigation{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px auto}.room-link,.room-pending{padding:14px 18px;border:1px solid #b9a892;border-radius:8px}.room-link{color:white;background:#59664b;font-weight:700;text-decoration:none}.room-pending{opacity:.65}.stage .room-hotspot{position:absolute;top:32%;z-index:5;display:flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;min-height:34px;max-width:34px;max-height:34px;aspect-ratio:1;border-radius:9999px!important;border:1.5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.12)!important;color:#fff;text-decoration:none;font:600 17px/1 system-ui,sans-serif;box-shadow:none!important;padding:0!important;touch-action:manipulation;transform:translateX(-50%);box-sizing:border-box;backdrop-filter:none}.female-door-label{left:23%}.male-door-label{left:77%;opacity:.55;cursor:not-allowed}.room-hotspot:focus-visible{outline:3px solid white;outline-offset:3px}.stage img{pointer-events:none}.room-link:focus-visible,.room-hotspot:focus-visible{outline:3px solid #fff;outline-offset:3px}.hint{font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #e4c597;outline-offset:3px}@media(max-width:600px){.stage{width:min(96vw,calc(87dvh * 9 / 16),715px);max-height:87dvh}}
.female-scene{display:none}body.show-female .reception-scene{display:none}body.show-female .female-scene{display:block}.female-scene .stage img.night{opacity:0}body.night .female-scene .stage img.night{opacity:1}</style></head><body><header><strong>BKBK AVATAR STUDIO</strong><a href="index.html#portfolio">← Back to studio</a></header><main><section class="reception-scene"><h1>Welcome to the Avatar Studio</h1><p>Reception · Choose your space</p><div class="stage" aria-label="Avatar Studio reception interior"><img class="day" src="assets/8C7D4EBF-6DA0-406C-A52F-5EC39F4D7210.png" alt="Reception by day"><img class="night" src="assets/267DEB92-3376-4DF8-BDE2-36D5142D3493.png" alt=""><a class="room-hotspot female-door-label" href="bkbk-avatar-female.html?v=20261013-door6" aria-label="Enter Female Dressing Room">→</a><span class="room-hotspot male-door-label" aria-label="Male dressing room coming soon" title="Coming soon">→</span></div><div class="controls"><button id="time" type="button" aria-pressed="false">☾ Night view</button></div></section><section class="female-scene" id="female-room"><h1>Female Dressing Room</h1><p>Avatar Studio · Female Corner</p><div class="stage"><img class="day" src="assets/419E8041-867B-44AD-B17A-5C8B7BAABD12.png" alt="Female room daytime"><img class="night" src="assets/5F60E49E-18EE-41D3-9A91-AFF8A390CA3A.png" alt="Female room nighttime"></div><div class="controls"><button type="button" id="female-time">☾ Night view</button><button type="button" class="back" id="back-reception">← Back to Reception</button></div></section></main><script>const time=document.getElementById('time');let night=false;try{night=localStorage.getItem('bkbk-mode')==='night'}catch{}function render(){document.body.classList.toggle('night',night);time.textContent=night?'☀ Day view':'☾ Night view';time.setAttribute('aria-pressed',String(night))}time.addEventListener('click',()=>{night=!night;render()});render();const femaleTime=document.getElementById('female-time');function route(){const female=location.hash==='#female-room';document.body.classList.toggle('show-female',female);femaleTime.textContent=night?'☀ Day view':'☾ Night view';window.scrollTo(0,0)}document.getElementById('back-reception').addEventListener('click',()=>{history.pushState(null,'','#reception');route()});window.addEventListener('popstate',route);window.addEventListener('hashchange',route);femaleTime.addEventListener('click',()=>{time.click();route()});route();</script></body></html>
