<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKBK Avatar Studio | Female Room</title><style>*{box-sizing:border-box}body{margin:0;background:#191917;color:#f7efe5;font:15px system-ui,-apple-system,sans-serif}header{padding:14px 22px;background:#211f1c;display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:inherit;text-decoration:none}header strong{letter-spacing:.12em}main{text-align:center;padding:22px 16px 48px}h1{font:clamp(27px,5vw,44px) Georgia,serif}p{color:#d8cabc}.stage{width:min(92vw,calc(70dvh * 9 / 16),580px);aspect-ratio:9/16;max-height:70dvh;position:relative;overflow:hidden;margin:20px auto;background:#443e34;border:1px solid #777063;border-radius:12px}.stage img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.stage img.night{opacity:0;transition:opacity .45s}body.night .stage img.night{opacity:1}button{border:1px solid #b9a892;background:#393630;color:inherit;border-radius:8px;padding:12px 18px;font:inherit}button:disabled{opacity:.65}a:focus-visible{outline:3px solid #e4c597}</style></head><body><header><strong>BKBK AVATAR STUDIO</strong><a href="bkbk-avatar-reception.html">← Reception</a></header><main><h1>Female Dressing Room</h1><p>Your dressing room · Avatar creation tools coming next</p><div class="stage"><img src="assets/419E8041-867B-44AD-B17A-5C8B7BAABD12.png" alt="Female dressing room daytime interior"><img class="night" src="assets/5F60E49E-18EE-41D3-9A91-AFF8A390CA3A.png" alt="Female dressing room nighttime interior"></div><button id="toggle" type="button" aria-pressed="false">☾ Night view</button></main><script>const toggle=document.getElementById('toggle');let night=false;try{night=localStorage.getItem('bkbk-mode')==='night'}catch{}function render(){document.body.classList.toggle('night',night);toggle.textContent=night?'☀ Day view':'☾ Night view';toggle.setAttribute('aria-pressed',String(night))}toggle.addEventListener('click',()=>{night=!night;try{localStorage.setItem('bkbk-mode',night?'night':'day')}catch{}render()});render();</script></body></html>
