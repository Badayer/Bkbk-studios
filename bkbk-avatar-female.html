<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKBK Avatar Studio | Female Room</title><style>*{box-sizing:border-box}body{margin:0;background:#191917;color:#f7efe5;font:15px system-ui,-apple-system,sans-serif}header{padding:14px 22px;background:#211f1c;display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:inherit;text-decoration:none}header strong{letter-spacing:.12em}main{text-align:center;padding:22px 16px 48px}h1{font:clamp(27px,5vw,44px) Georgia,serif}p{color:#d8cabc}.stage{width:min(96vw,calc(87dvh * 9 / 16),715px);aspect-ratio:9/16;max-height:87dvh;position:relative;overflow:hidden;margin:20px auto;background:#443e34;border:1px solid #777063;border-radius:12px}.stage img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.stage img.night{opacity:0;transition:opacity .45s}body.night .stage img.night{opacity:1}button{border:1px solid #b9a892;background:#393630;color:inherit;border-radius:8px;padding:12px 18px;font:inherit}button:disabled{opacity:.65}a:focus-visible{outline:3px solid #e4c597}</style><style>
.avatar-demo{max-width:980px;margin:24px auto;border:1px solid #86796a;border-radius:15px;padding:20px;background:#25231f}.avatar-demo h2{font:28px Georgia,serif;margin:0 0 8px}.avatar-demo .note{font-size:13px;margin:6px auto 16px}.demo-layout{display:grid;grid-template-columns:minmax(210px,1fr) minmax(240px,1fr);gap:20px;align-items:center}.avatar-preview{position:relative;aspect-ratio:3/4;background:linear-gradient(150deg,#c8bca7,#8e8678);border-radius:12px;overflow:hidden;display:grid;place-items:center}.avatar-preview svg{width:100%;height:100%;max-height:490px}.avatar-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.avatar-fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.avatar-fields select,.avatar-fields input{width:100%;min-height:38px;background:#f8f4ec;color:#29251f;border:1px solid #b9aa99;border-radius:7px;padding:6px}.avatar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.avatar-actions button{background:#555e4a}.avatar-feedback{font-size:12px;min-height:20px}@media(max-width:680px){.demo-layout{grid-template-columns:1fr}.avatar-preview{max-width:340px;width:100%;margin:auto}.avatar-demo{padding:14px}}
</style></head><body><header><strong>BKBK AVATAR STUDIO</strong><a href="bkbk-avatar-reception.html">← Reception</a></header><main><h1>Female Dressing Room</h1><p>Your dressing room · Avatar creation tools coming next</p><div class="stage"><img src="assets/419E8041-867B-44AD-B17A-5C8B7BAABD12.png" alt="Female dressing room daytime interior"><img class="night" src="assets/5F60E49E-18EE-41D3-9A91-AFF8A390CA3A.png" alt="Female dressing room nighttime interior"></div><button id="toggle" type="button" aria-pressed="false">☾ Night view</button><section class="avatar-demo" aria-labelledby="demo-title"><h2 id="demo-title">Avatar Creator · Prototype</h2><p class="note">Interactive 2D fitting test — not the final realistic BKBK character. Change features and save your choices on this device.</p><div class="demo-layout"><div class="avatar-preview"><svg viewBox="0 0 360 480" role="img" aria-label="Editable illustrated avatar prototype"><defs><linearGradient id="skinlight"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient></defs><path id="backhair" d="M105 232Q88 85 180 68Q272 85 255 232L230 260H126Z" fill="#352923"/><path id="body" d="M118 300Q153 278 162 250H198Q207 282 242 300L272 474H88Z" fill="#d9c9ad"/><path id="neck" d="M158 229H202V276Q180 302 158 276Z" fill="#c69c7d"/><ellipse id="face" cx="180" cy="173" rx="76" ry="98" fill="#c69c7d"/><ellipse cx="180" cy="173" rx="76" ry="98" fill="url(#skinlight)"/><path id="fringe" d="M106 158Q94 79 162 73Q227 53 254 144Q222 119 203 105Q153 147 106 158Z" fill="#352923"/><g id="eyes"><path d="M129 174Q146 164 160 174M201 174Q216 164 231 174" fill="none" stroke="#45382e" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="174" r="5" fill="#6c7f70"/><circle cx="216" cy="174" r="5" fill="#6c7f70"/></g><path d="M180 178L174 208Q180 213 187 208" stroke="#986c55" stroke-width="3" fill="none"/><path id="lips" d="M156 234Q180 248 204 234Q180 257 156 234Z" fill="#aa6972"/><ellipse id="blush1" cx="128" cy="214" rx="20" ry="9" fill="#d1848c" opacity=".2"/><ellipse id="blush2" cx="231" cy="214" rx="20" ry="9" fill="#d1848c" opacity=".2"/></svg></div><div><div class="avatar-fields">
<label>Skin tone<select id="av-skin"><option value="#e9c5a5">Light</option><option value="#c69c7d" selected>Medium</option><option value="#986b4d">Tan</option><option value="#694732">Deep</option></select></label>
<label>Eye color<select id="av-eyes"><option value="#6c7f70">Green gray</option><option value="#59432d">Brown</option><option value="#5a6f8d">Blue gray</option></select></label>
<label>Hair color<select id="av-hair"><option value="#352923">Dark brown</option><option value="#161615">Black</option><option value="#7b5339">Chestnut</option><option value="#b99a67">Blonde</option></select></label>
<label>Hair style<select id="av-style"><option value="soft">Soft fringe</option><option value="side">Side part</option><option value="open">Open forehead</option></select></label>
<label>Lip color<select id="av-lips"><option value="#aa6972">Rose</option><option value="#8e434e">Berry</option><option value="#b88375">Nude</option></select></label>
<label>Blush<select id="av-blush"><option value=".2">Natural</option><option value=".55">Soft glam</option><option value="0">None</option></select></label>
<label>Height <output id="height-value">165 cm</output><input id="av-height" type="range" min="145" max="190" value="165"/></label>
<label>Body shape<select id="av-body"><option value="1">Regular</option><option value=".85">Slim</option><option value="1.17">Curvy</option></select></label>
</div><div class="avatar-actions"><button id="avatar-save" type="button">Save prototype</button><button id="avatar-reset" type="button">Reset</button></div><p class="avatar-feedback" id="avatar-status" role="status"></p></div></div></section></main><script>const toggle=document.getElementById('toggle');let night=false;try{night=localStorage.getItem('bkbk-mode')==='night'}catch{}function render(){document.body.classList.toggle('night',night);toggle.textContent=night?'☀ Day view':'☾ Night view';toggle.setAttribute('aria-pressed',String(night))}toggle.addEventListener('click',()=>{night=!night;try{localStorage.setItem('bkbk-mode',night?'night':'day')}catch{}render()});render();</script><script>
(()=>{const ids=['skin','eyes','hair','style','lips','blush','height','body'];const el=id=>document.getElementById('av-'+id);const all=()=>Object.fromEntries(ids.map(k=>[k,el(k).value]));const defaults=all();const paint=()=>{const v=all();document.getElementById('face').setAttribute('fill',v.skin);document.getElementById('neck').setAttribute('fill',v.skin);document.getElementById('backhair').setAttribute('fill',v.hair);document.getElementById('fringe').setAttribute('fill',v.hair);document.querySelectorAll('#eyes circle').forEach(c=>c.setAttribute('fill',v.eyes));document.getElementById('lips').setAttribute('fill',v.lips);['blush1','blush2'].forEach(id=>document.getElementById(id).setAttribute('opacity',v.blush));const hairShape={soft:'M106 158Q94 79 162 73Q227 53 254 144Q222 119 203 105Q153 147 106 158Z',side:'M106 158Q95 76 176 70Q246 68 254 145Q199 120 187 88Q159 139 106 158Z',open:'M106 154Q97 77 175 70Q247 67 254 151Q240 116 220 101Q181 76 142 108Q123 122 106 154Z'};document.getElementById('fringe').setAttribute('d',hairShape[v.style]);document.getElementById('body').setAttribute('transform','translate(180 0) scale('+v.body+' 1) translate(-180 0)');document.getElementById('height-value').textContent=v.height+' cm';document.querySelector('.avatar-preview svg').style.transform='scale('+(.90+(+v.height-145)/450)+')'};try{const saved=JSON.parse(localStorage.getItem('bkbk-avatar-prototype')||'null');if(saved)for(const k of ids)if(saved[k]!==undefined)el(k).value=saved[k]}catch{}ids.forEach(k=>el(k).addEventListener('input',paint));document.getElementById('avatar-save').addEventListener('click',()=>{try{localStorage.setItem('bkbk-avatar-prototype',JSON.stringify(all()));document.getElementById('avatar-status').textContent='Saved on this device.'}catch{document.getElementById('avatar-status').textContent='Storage not available.'}});document.getElementById('avatar-reset').addEventListener('click',()=>{for(const k of ids)el(k).value=defaults[k];paint();document.getElementById('avatar-status').textContent='Reset to defaults.'});paint()})();
</script></body></html>
